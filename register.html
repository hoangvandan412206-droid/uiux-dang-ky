<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
    <div class="form-box">

        <h1>Đăng ký tài khoản</h1>
        <p class="subtitle">Tạo tài khoản để bắt đầu sử dụng hệ thống</p>

        <form action="success.html">

            <label>Họ và tên</label>
            <input type="text"
                   placeholder="Nhập họ và tên"
                   required>

            <label>Email</label>
            <input type="email"
                   placeholder="Nhập email"
                   required>

            <label>Mật khẩu</label>
            <input type="password"
                   placeholder="Nhập mật khẩu"
                   required>

            <label>Xác nhận mật khẩu</label>
            <input type="password"
                   placeholder="Nhập lại mật khẩu"
                   required>

            <button type="submit">
                ĐĂNG KÝ
            </button>

        </form>

        <p class="login">
            Đã có tài khoản?
            <a href="#">Đăng nhập</a>
        </p>

    </div>
</div>

</body>
</html>
